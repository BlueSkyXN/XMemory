name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Package checks, tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check XMemory package
        run: python -B tools/check_package.py
      - name: Check Client Readers package
        run: python -B tools/build_client_readers.py --check
      - name: Run unit tests
        run: python -B -m unittest discover -s tests -v
      - name: Build XMemory archives
        run: python -B tools/build_release.py --output "$RUNNER_TEMP/xmemory-release"
      - name: Build Client Readers archives
        run: python -B tools/build_client_readers.py --output "$RUNNER_TEMP/client-readers-release"

  runtime-python39:
    # 技能运行时要能在 macOS 自带的 python3（3.9）上跑；开发工具仍用 3.11。
    name: Skill runtimes on Python 3.9
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"
      - name: Run runtime and reader tests
        run: python -B -m unittest tests.test_xmemory_status tests.test_client_readers tests.test_client_memory tests.test_client_runtime -v

  runtime-windows:
    name: Client readers on Windows
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Run reader and memory tests
        run: python -B -m unittest tests.test_client_readers tests.test_client_memory tests.test_client_runtime -v

  runtime-zstandard:
    name: Optional zstandard backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install optional backend on CI runner
        run: python -m pip install zstandard
      - name: Show backend version
        run: python -c "import zstandard; print(zstandard.__version__)"
      - name: Test real optional backend
        run: python -B -m unittest tests.ci_zstandard_backend -v
