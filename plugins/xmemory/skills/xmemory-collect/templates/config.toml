# XMemory 用户级集中库配置，默认位于 ~/.agents/memory/config.toml。
# 这不是任何客户端的原生配置；示例身份和路径不能当成真实设置。
# 记忆内容不登记设备：路径只在部分机器上存在是正常的，本机没有就跳过。
format = "xmemory/v1"
# explicit：只在用户要求时记录；milestone：另在被纠正、说明偏好、做出决定、阶段交接时记录。
capture = "milestone"
# 会话最后活动后多少分钟才视为静默、可以采集。
quiet_minutes = 60
# 设置时按本机时区填写，所有日期按它落位，例如 timezone = "Asia/Shanghai"。
# timezone = "<IANA 时区名>"

# 工作区容器目录：容器本身不是项目，其下第一层目录可作为项目根候选。
# [workspace]
# containers = ["~/work"]

# 项目名等于平台项目根目录名，原样保留；同名冲突写成 "<名>@<父目录名>"。
# [projects."demo-api"]
# roots = ["~/work/demo-api"]
# repo = "github.com/owner/demo-api"
# aliases = { zcode = "demo-api-0123456789abcdef", claude = "-Users-alice-work-demo-api", qoder = "Users-alice-work-demo-api" }
# owner = "xmemory"

# 外部维护的项目只登记入口，不在本库建立项目正文。
# [projects."legacy-notes"]
# owner = "external"
# entry = "~/work/legacy-notes/.agents/memory/MEMORY.md"

# 来源只读。kind：native-memory / session / daily / profile / workspace。
# route：by-cwd / by-alias / by-mention / fixed:<项目名>。
# [sources.codex-memory]
# client = "codex"
# kind = "native-memory"
# path = "~/.codex/memories"
# route = "by-cwd"
# enabled = false

# [sources.codex-sessions]
# client = "codex"
# kind = "session"
# path = "~/.codex/sessions"
# route = "by-cwd"
# reader = "已安装的会话读取技能或宿主历史查询"
# enabled = false
